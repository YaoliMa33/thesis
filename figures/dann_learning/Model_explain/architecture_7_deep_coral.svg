<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="950" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Deep CORAL: Correlation Alignment for Sensor-drift Adaptation</text>
<text x="950" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4b5563">Shared G_f learns gas-discriminative features while matching source and target covariance matrices.</text>
<rect x="35" y="118" width="380" height="770" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="225" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">1. Source + Target</text>
<rect x="455" y="118" width="385" height="770" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="647" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">2. Shared Feature Extractor</text>
<rect x="885" y="118" width="320" height="770" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="1045" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">3. Gas Head</text>
<rect x="1245" y="118" width="300" height="770" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="1395" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">4. Latent Distributions</text>
<rect x="1585" y="118" width="280" height="770" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="1725" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">5. CORAL Alignment</text>
<rect x="80" y="205" width="285" height="118" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="222" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Labeled source</text>
<text x="222" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">X_s in R^(N_s x 54)</text>
<text x="222" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">gas labels y_s -&gt; L</text>
<rect x="80" y="375" width="285" height="118" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="222" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Target domain</text>
<text x="222" y="427" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">X_t in R^(N_t x 54)</text>
<text x="222" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">UDA: features only -&gt; L_coral</text>
<rect x="80" y="550" width="285" height="130" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="222" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Shared feature inputs</text>
<text x="222" y="602" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">X_s and X_t use the same G_f</text>
<text x="222" y="624" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">no domain classifier</text>
<text x="222" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">no domain labels</text>
<rect x="80" y="730" width="285" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="222" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Semi option</text>
<text x="222" y="782" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">labeled target trials join L</text>
<text x="222" y="804" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">alignment still uses h_s and h_t</text>
<line x1="365" y1="265" x2="500" y2="280" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="365" y1="435" x2="500" y2="305" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="365" y1="615" x2="500" y2="325" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="500" y="225" width="295" height="98" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="647" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Shared feature extractor G_f</text>
<text x="647" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">one-layer: 54 -&gt; 16</text>
<text x="647" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">two-layer: 54 -&gt; 32 -&gt; 16</text>
<rect x="500" y="385" width="295" height="88" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="647" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">ReLU + Dropout 0.05</text>
<text x="647" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">same parameters for both domains</text>
<rect x="500" y="555" width="295" height="110" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="647" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Latent representations</text>
<text x="647" y="607" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">h_s = G_f(X_s) in R^(N_s x 16)</text>
<text x="647" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">h_t = G_f(X_t) in R^(N_t x 16)</text>
<line x1="647" y1="323" x2="647" y2="385" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="647" y1="473" x2="647" y2="555" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="910" y="245" width="270" height="98" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1045" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Gas classifier G_y</text>
<text x="1045" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Linear 16 -&gt; C</text>
<text x="1045" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">C = 3</text>
<rect x="910" y="410" width="270" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1045" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Gas logits z_y</text>
<text x="1045" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">softmax -&gt; gas probability</text>
<text x="1045" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">air / alcohol / acetone</text>
<rect x="900" y="650" width="290" height="165" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="1045" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Classification loss L</text>
<text x="1045" y="702" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">p_i = softmax(G_y(h_i))</text>
<text x="1045" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">L = CE(p_s, y_s) in UDA</text>
<text x="1045" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Semi: CE over source + labeled target</text>
<text x="1045" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">unlabeled target gas labels are not used</text>
<line x1="1045" y1="343" x2="1045" y2="410" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1045" y1="522" x2="1045" y2="650" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="795" y1="610" x2="910" y2="292" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1270" y="245" width="250" height="105" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1395" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Source latent set</text>
<text x="1395" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">H_s = {h_s,i}</text>
<text x="1395" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">shape N_s x 16</text>
<rect x="1270" y="430" width="250" height="105" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1395" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Target latent set</text>
<text x="1395" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">H_t = {h_t,j}</text>
<text x="1395" y="501" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">shape N_t x 16</text>
<rect x="1270" y="630" width="250" height="135" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1395" y="663" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Alignment inputs</text>
<text x="1395" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">computed from h_s and h_t</text>
<text x="1395" y="701" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">N_s and N_t may differ</text>
<text x="1395" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">gas labels not required</text>
<line x1="795" y1="598" x2="1270" y2="300" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="795" y1="625" x2="1270" y2="482" stroke="#059669" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="1395" y1="350" x2="1395" y2="630" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="1395" y1="535" x2="1395" y2="630" stroke="#059669" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="1608" y="220" width="235" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1725" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Domain covariance</text>
<text x="1725" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">C_s = cov(H_s)</text>
<text x="1725" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">C_t = cov(H_t)</text>
<text x="1725" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">each matrix: 16 x 16</text>
<rect x="1608" y="420" width="235" height="175" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1725" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Deep CORAL loss</text>
<text x="1725" y="473" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">L_coral = ||C_s - C_t||_F^2</text>
<text x="1725" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">/ (4 d^2)</text>
<text x="1725" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">d = 16</text>
<text x="1725" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">aligns second-order statistics</text>
<line x1="1520" y1="300" x2="1608" y2="280" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="1520" y1="482" x2="1608" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="1725" y1="340" x2="1725" y2="420" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1600" y="680" width="250" height="125" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="1725" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">Optimized scalar</text>
<text x="1725" y="736" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">L_total = L + lambda_coral L_coral</text>
<text x="1725" y="756" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">no GRL</text>
<text x="1725" y="776" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">no domain discriminator</text>
<line x1="1725" y1="595" x2="1725" y2="680" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="918" width="1285" height="62" rx="8" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
<text x="1207" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">G_f minimizes classification error and covariance mismatch jointly; target gas labels are unnecessary in UDA.</text>
<rect x="895" y="825" width="300" height="76" rx="8" fill="#faf5ff" stroke="#2563eb" stroke-width="2"/>
<text x="1045" y="851" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Gas-label usage</text>
<text x="1045" y="869" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">UDA: y_s only -&gt; L</text>
<text x="1045" y="887" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Semi: source + labeled target -&gt; L</text>
<rect x="1598" y="825" width="255" height="76" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1725" y="851" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Alignment-label usage</text>
<text x="1725" y="869" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">L_coral uses H_s and H_t only</text>
<text x="1725" y="887" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">no gas/domain labels</text>
<rect x="35" y="905" width="510" height="105" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1"/>
<text x="290" y="928" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">Training settings in unified suite</text>
<text x="290" y="944" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">epochs=400, Adam, lr=0.01, weight_decay=1e-4</text>
<text x="290" y="960" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">seeds: 0, 1, 2, 3, 4; lambda candidates: 0.001, 0.01, 0.1, 1.0</text>
<text x="290" y="976" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">UDA: source gas labels only; Semi: Source+Target refit</text>
<text x="290" y="992" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">loss follows VisionLearningGroup/Deep CORAL</text>
</svg>