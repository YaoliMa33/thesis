<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="1040" viewBox="0 0 1980 1040">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="990" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Official CDAN-style Conditional Adversarial Domain Adaptation</text>
<text x="990" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4b5563">Three-class only. CDAN conditions the domain discriminator on latent feature h and gas probability g: G_cd(T(h,g)).</text>
<rect x="30" y="115" width="350" height="800" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="420" y="115" width="330" height="800" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="790" y="115" width="300" height="800" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="1130" y="115" width="360" height="800" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="1530" y="115" width="390" height="800" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="205" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">1. Inputs</text>
<text x="585" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">2. Shared Feature Extractor</text>
<text x="940" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">3. Gas Head</text>
<text x="1310" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">4. CDAN Conditioning</text>
<text x="1725" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">5. Conditional Domain Head</text>
<rect x="65" y="205" width="280" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="205" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Source features</text>
<text x="205" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">X_s in R^(N_s x r)</text>
<text x="205" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">r=54, gas labels y_s -&gt; L</text>
<rect x="65" y="375" width="280" height="112" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="205" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Target features</text>
<text x="205" y="427" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">X_t in R^(N_t x r)</text>
<text x="205" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">all S1-S7: features for Ld_cdan</text>
<rect x="65" y="555" width="280" height="128" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="205" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Domain feature batch</text>
<text x="205" y="607" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">X_d = concat(X_s, X_t)</text>
<text x="205" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">features only -&gt; G_f</text>
<text x="205" y="651" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">labels do not enter G_f</text>
<rect x="65" y="745" width="280" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205" y="778" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Semi option</text>
<text x="205" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">S5-S7 X_t,labeled, y_t,labeled</text>
<text x="205" y="822" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">can be added to L</text>
<rect x="455" y="230" width="260" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="585" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">G_f layer 1</text>
<text x="585" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Linear r -&gt; 32, ReLU</text>
<text x="585" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">r = 54 in this report</text>
<rect x="455" y="370" width="260" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="585" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">G_f layer 2</text>
<text x="585" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Dropout 0.05, Linear 32 -&gt; 16, ReLU</text>
<rect x="455" y="540" width="260" height="88" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="585" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Latent feature</text>
<text x="585" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">h = G_f(x) in R^16</text>
<text x="585" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">h_s, h_t, h_d</text>
<line x1="585" y1="308" x2="585" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="585" y1="448" x2="585" y2="540" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="345" y1="260" x2="455" y2="270" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="345" y1="430" x2="455" y2="292" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="345" y1="615" x2="455" y2="306" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="245" width="240" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="940" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Gas classifier G_y</text>
<text x="940" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Linear 16 -&gt; C</text>
<text x="940" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">C = 3</text>
<rect x="820" y="420" width="240" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="940" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Gas logits z_y</text>
<text x="940" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">g = softmax(z_y)</text>
<text x="940" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">g in R^C</text>
<rect x="805" y="650" width="270" height="160" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="940" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#111827">Classification loss</text>
<text x="940" y="698" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#111827">z_y = G_y(G_f(x_i))</text>
<text x="940" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#111827">p_i,k = softmax(z_y)_k</text>
<text x="940" y="734" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#111827">L = -1/N_cls sum_i log p_i,y_i</text>
<text x="940" y="752" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#111827">UDA: y_i from source only</text>
<text x="940" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#111827">semi: source + labeled target</text>
<line x1="715" y1="585" x2="820" y2="285" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="940" y1="335" x2="940" y2="420" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="940" y1="532" x2="940" y2="660" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1170" y="245" width="280" height="108" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1310" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827">Official CDAN map</text>
<text x="1310" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827">T(h,g) = g outer h</text>
<text x="1310" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111827">shape: N x (C*16)</text>
<rect x="1170" y="455" width="280" height="126" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1310" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Three-class report</text>
<text x="1310" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">C=3</text>
<text x="1310" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">T in R^(N x 48)</text>
<text x="1310" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">task = three_class_with_air</text>
<rect x="1170" y="690" width="280" height="92" rx="8" fill="#fdf4ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1310" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Prediction handling</text>
<text x="1310" y="744" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">g is detached for Ld_cdan</text>
<text x="1310" y="766" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">L still updates G_y normally</text>
<line x1="715" y1="585" x2="1170" y2="300" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="1060" y1="475" x2="1170" y2="300" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<line x1="1310" y1="353" x2="1310" y2="455" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1310" y1="581" x2="1310" y2="690" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1575" y="230" width="300" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1725" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Gradient reversal</text>
<text x="1725" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">GRL_lambda(T): forward = T</text>
<rect x="1575" y="370" width="300" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1725" y="407" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Conditional domain discriminator</text>
<text x="1725" y="429" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">G_cd: C*16 -&gt; 32, ReLU</text>
<text x="1725" y="451" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">32 -&gt; 2</text>
<rect x="1575" y="550" width="300" height="108" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
<text x="1725" y="587" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Domain logits z_cd</text>
<text x="1725" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">source vs target</text>
<text x="1725" y="631" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">domain labels y_dom: 0 / 1</text>
<rect x="1565" y="720" width="320" height="160" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="1725" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#111827">CDAN domain loss</text>
<text x="1725" y="768" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#111827">u_i = GRL_lambda(T(h_i,g_i))</text>
<text x="1725" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#111827">q_i,d = softmax(G_cd(u_i))_d</text>
<text x="1725" y="804" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#111827">Ld_cdan = -1/N_d sum_i log q_i,y_dom,i</text>
<text x="1725" y="822" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#111827">gas labels not used in Ld_cdan</text>
<line x1="1450" y1="300" x2="1575" y2="270" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1725" y1="312" x2="1725" y2="370" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1725" y1="475" x2="1725" y2="550" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1725" y1="658" x2="1725" y2="735" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1120" y="925" width="620" height="62" rx="8" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
<text x="1430" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Code computes L + Ld_cdan; through GRL, G_f effectively minimizes L - lambda * Ld_cdan.</text>
<text x="1430" y="978" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#374151">CDAN+C-DANN in code adds the ordinary DANN domain head G_d and centroid loss Lc from the C-DANN diagram.</text>
<rect x="35" y="910" width="520" height="112" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1"/>
<text x="295" y="934" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">Training settings</text>
<text x="295" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">epochs=400, Adam, lr=0.01, weight_decay=1e-4</text>
<text x="295" y="966" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">seeds: 7, 11, 23; lambda: 0.05, 0.2, 0.5</text>
<text x="295" y="982" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">with validation: grid search and validation selection</text>
<text x="295" y="998" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">S1 has no validation: fixed defaults; val metrics = NA</text>
</svg>