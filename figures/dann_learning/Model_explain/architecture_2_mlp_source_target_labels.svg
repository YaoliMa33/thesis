<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="990" viewBox="0 0 1700 990">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="850" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">MLP Baseline with Source + Target Labels</text>
<text x="850" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4b5563">Three-class only. Supervised target-label calibration baseline; no adversarial domain alignment.</text>
<rect x="45" y="118" width="390" height="740" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="485" y="118" width="385" height="740" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="925" y="118" width="355" height="740" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<rect x="1335" y="118" width="320" height="740" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
<text x="240" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">1. Labeled Source + Target</text>
<text x="677" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">2. MLP Feature Layers</text>
<text x="1102" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">3. Gas Prediction</text>
<text x="1495" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">4. Evaluation</text>
<rect x="88" y="210" width="305" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="240" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Source training labels</text>
<text x="240" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">X_s in R^(N_s x r)</text>
<text x="240" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">y_s available for L</text>
<rect x="88" y="370" width="305" height="128" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="240" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Selected target labels</text>
<text x="240" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">X_t,labeled, y_t,labeled</text>
<text x="240" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Day subset defined by split</text>
<text x="240" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">used for L</text>
<rect x="88" y="565" width="305" height="118" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="240" y="598" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Validation labels</text>
<text x="240" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">used for model selection only</text>
<text x="240" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">S1 has no validation -&gt; NA</text>
<line x1="393" y1="265" x2="540" y2="290" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="393" y1="430" x2="540" y2="310" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="393" y1="620" x2="540" y2="455" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="540" y="250" width="280" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="680" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Feature extractor G_f</text>
<text x="680" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Linear r -&gt; 32, ReLU</text>
<text x="680" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">r = 54 in this report</text>
<rect x="540" y="385" width="280" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="680" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Dropout 0.05</text>
<text x="680" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Linear 32 -&gt; 16, ReLU</text>
<rect x="540" y="540" width="280" height="88" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="680" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#111827">Latent feature</text>
<text x="680" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#111827">h = G_f(x) in R^16</text>
<line x1="680" y1="328" x2="680" y2="385" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="463" x2="680" y2="540" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="820" y1="585" x2="950" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="950" y="250" width="285" height="95" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1092" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Gas classifier G_y</text>
<text x="1092" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Linear 16 -&gt; C</text>
<text x="1092" y="321" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">C = 3</text>
<rect x="950" y="415" width="285" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1092" y="453" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Gas logits z_y</text>
<text x="1092" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">softmax -&gt; gas probability</text>
<text x="1092" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">prediction: air / alcohol / acetone</text>
<line x1="1092" y1="345" x2="1092" y2="415" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="940" y="635" width="305" height="170" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="1092" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Classification loss</text>
<text x="1092" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">z_y = G_y(G_f(x_i))</text>
<text x="1092" y="703" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">p_i,k = softmax(z_y)_k</text>
<text x="1092" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">L = -1/N_cls sum_i log p_i,y_i</text>
<text x="1092" y="741" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">labels: source + labeled target</text>
<line x1="1092" y1="525" x2="1092" y2="635" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1360" y="255" width="270" height="125" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1495" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">Held-out target test</text>
<text x="1495" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">X_t,test in R^(N_t x 54)</text>
<text x="1495" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#111827">test labels hidden during training</text>
<rect x="1360" y="425" width="270" height="90" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="1495" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Predicted labels</text>
<text x="1495" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">y_hat_t = argmax softmax(z_y)</text>
<rect x="1360" y="585" width="270" height="135" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<text x="1495" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">Report metrics</text>
<text x="1495" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">compare y_hat_t with y_t,test</text>
<text x="1495" y="664" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">accuracy, balanced acc.</text>
<text x="1495" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#111827">macro-F1, confusion matrix</text>
<line x1="1235" y1="470" x2="1360" y2="470" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1495" y1="515" x2="1495" y2="585" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="885" width="920" height="58" rx="8" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
<text x="865" y="922" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#111827">Optimized objective in code: minimize L on source + selected labeled target samples only.</text>
<rect x="70" y="725" width="340" height="82" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
<text x="240" y="751" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Classification labels</text>
<text x="240" y="769" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">y_cls = concat(y_s, y_t,labeled)</text>
<text x="240" y="787" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">used in L</text>
<rect x="1348" y="735" width="295" height="92" rx="8" fill="#faf5ff" stroke="#dc2626" stroke-width="2"/>
<text x="1495" y="761" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">No domain adaptation</text>
<text x="1495" y="779" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">no G_d, no GRL, no Ld</text>
<text x="1495" y="797" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">not a DANN model</text>
<rect x="72" y="810" width="335" height="76" rx="8" fill="#faf5ff" stroke="#059669" stroke-width="2"/>
<text x="239" y="836" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">Target-test labels</text>
<text x="239" y="854" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">y_t,test used only after training</text>
<text x="239" y="872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111827">final metrics only</text>
<rect x="40" y="865" width="360" height="112" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1"/>
<text x="220" y="889" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">Training settings in code</text>
<text x="220" y="905" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">epochs=400, Adam, lr=0.01, weight_decay=1e-4</text>
<text x="220" y="921" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">seeds: 7, 11, 23; lambda: 0.05, 0.2, 0.5</text>
<text x="220" y="937" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">with validation: select by val macro-F1 / BA / acc</text>
<text x="220" y="953" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#374151">S1 has no validation: fixed defaults; val metrics = NA</text>
</svg>